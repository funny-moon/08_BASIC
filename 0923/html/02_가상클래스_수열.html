<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h3:hover {
        color: red;
      }
      li {
        list-style: none;
        font-size: 30px;
        font-weight: bold;
      }
      li:first-child {
        color: blue;
      }
      li:nth-child(2) {
        color: #e72828;
      }
      li:nth-child(3) {
        color: #14e66b;
      }
      li:nth-child(4) {
        color: #360bf8;
      }
      li:nth-child(5) {
        color: #ff0ad6;
      }
      li:nth-child(6) {
        color: #e72828;
      }
      li:nth-child(7) {
        color: #006e18;
      }
      li:nth-child(8) {
        color: #06a4ff;
      }
      li:nth-child(9) {
        color: #4d0050;
      }
      li:last-child {
        color: orange;
      }
    </style>
  </head>
  <body>
    <h2>가상클래스 (의사클래스)</h2>
    <h3>마우스 오버</h3>

    <ul>
      <li>001</li>
      <li>002</li>
      <li>003</li>
      <li>004</li>
      <li>005</li>
      <li>006</li>
      <li>007</li>
      <li>008</li>
      <li>009</li>
      <li>010</li>
      <li>011</li>
      <li>012</li>
    </ul>
  </body>
</html>
