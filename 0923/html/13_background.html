      헌법이나 법률에 위반되는 여부가 재판의 전제가 된 경우에는 대법원은 이를 최종적으로 심사할 권한을 가진다. 대통령의

      때에는 현행범인이 아닌 한 국회의 요구가 있으면 회기중 석방된다.
