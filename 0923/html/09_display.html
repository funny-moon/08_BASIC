<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 100px;
        height: 100px;
        background-color: red;
        border: 2px solid #000;

        display: inline-block;
      }
      h1,
      p {
        display: inline;
      }
      span {
        display: block;
        width: 100px;
        height: 100px;
        background-color: yellow;
      }
      img {
        display: block;
      }

      /* block :브라우저의 전체를 차지 ex) div p h form ul li 등등  */
      /* inline : 그 요소의 공간만 차지 ex) span img b i em strong input 등등 */
      /* inline-block : inline속성과 block 속성을 함께 가지고 있다  */
    </style>
  </head>
  <body>
    <!-- 블록/ 인라인 -->
    <div>블록</div>
    <div>블록</div>
    <div>블록</div>
    <div>블록</div>
    <div>블록</div>

    <h1>hhhhhhhhh</h1>
    <p>ppppppp</p>

    <span>동해물과</span><span>백두산이</span><span>마르고 닳도록</span>

    <hr />
    <img src="../img/bird.jpg" alt="" width="200" />
    <img src="../img/button.jpg" alt="" width="200" />
    <img src="../img/cat.jpg" alt="" width="200" />
    <img src="../img/lion.jpg" alt="" width="200" />
    <img src="../img/puppy.jpeg" alt="" width="200" />
    <img src="../img/tiger.jpg" alt="" width="200" />
  </body>
</html>
