<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: rgb(57, 2, 184);
      }
      p {
        color: red;
      }
      .color01 {
        background-color: blue;
      }
      .color02 {
        background-color: #3fff25;
      }
      .color03 {
        background-color: rgb(214, 77, 77);
      }
      .color04 {
        background-color: rgba(176, 224, 0, 0.329);
      }
      /* alpha : 0 ~ 1 */
      .color05 {
        color: #8b25ff;
        background-color: #000;
        opacity: 0.3;
        /* opacity : 0 ~ 1 */
      }
    </style>
  </head>
  <body>
    <h1>CSS Color Chart</h1>

    <!-- p.color$$*10{COLOR$$} -->
    <p class="color01">COLOR01</p>
    <p class="color02">COLOR02</p>
    <p class="color03">COLOR03</p>
    <p class="color04">COLOR04</p>
    <p class="color05">COLOR05</p>
    <p class="color06">COLOR06</p>
    <p class="color07">COLOR07</p>
    <p class="color08">COLOR08</p>
    <p class="color09">COLOR09</p>
    <p class="color10">COLOR10</p>
  </body>
</html>
