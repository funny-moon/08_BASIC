<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 선택자 {속성 : 속성값; } */
      h1 {
        color: red;
      }
      #blue {
        color: blue;
      }
      p {
        color: yellow;
      }
      .black {
        background-color: gray;
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>안녕하세요</h1>
    <h2>반갑습니다</h2>
    <h1 id="blue">열심히 공부합시다</h1>
    <p>또만나요</p>
    <p>점심 맛있게 드셨나요?</p>
    <p class="black">저녁 맛있게 드셨나요?</p>
    <p>아침 맛있게 드셨나요?</p>
    <p class="black">간식 맛있게 드셨나요?</p>
    <p class="black">야식 맛있게 드셨나요?</p>

    <!-- 
      선택자 {속성 : 속성값; }
      선택자의 종류
      1) 태그   - h1 { ... }
      2) 아이디 - #id { ... }
      3) 클래스 - .class { ... }

      ⭐아이디, 클래스 이름 만들때 규칙
      
      한글 🚫
      숫자 + 영문 🚫
      띄어글씨 🚫
      특수문자 🚫
      첫글자 대문자 🚫
      의미 없는 글자 zzz, nnn 🚫

      영문+숫자 👌
      특수문자중 _ -  black-pink  black_pink  👌
      팀원들이 서로 이해할 수 있는 의미있는 단어 banner, item...  

    -->
  </body>
</html>
