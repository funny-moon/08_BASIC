<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      section > p {
        color: red;
      }
      section nav h2 {
        color: blue;
      }
      article > div > p {
        color: hotpink;
      }
      /* 
        A의 모든 후손 B
        A B { ... }

        A의 직계 자식 B
        A > B { ... }
      */
    </style>
  </head>
  <body>
    <article>
      <section>
        <h2>APPLE</h2>
        <nav>
          <h2>네비게이션</h2>
          <p>회원가입</p>
        </nav>
      </section>
      <div>
        <h2>배너</h2>
        <p>상품상세설명</p>
      </div>
    </article>
  </body>
</html>
