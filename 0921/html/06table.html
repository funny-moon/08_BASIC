<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>표만들기</title>
    </head>
    <body>
        <!-- ul>li*3 -->
        <ul>
            <li>222</li>
            <li>111</li>
            <li>333</li>
        </ul>
        <table border="1">
            <tr>
                <td colspan="3">칼라</td>
            </tr>
            <tr>
                <td>노랑색</td>
                <td rowspan="2">100개</td>
                <td>천호동</td>
            </tr>
            <tr>
                <td>빨간색</td>

                <td>명일동13-1</td>
            </tr>
        </table>
        <hr />
        <!-- table>tr*3>td*2 -->
        <table border="1">
            <tr>
                <td></td>
                <td>33333</td>
            </tr>
            <tr>
                <td>4444</td>
                <td>555</td>
            </tr>
            <tr>
                <td>666</td>
                <td>7777</td>
            </tr>
        </table>

        <table border="1">
            <caption>
                아트박스물품
            </caption>
            <tr>
                <th>문구류</th>
                <th>개수</th>
                <th>색상</th>
            </tr>
            <tr>
                <td colspan="2">색종이</td>

                <td>노랑</td>
            </tr>
            <tr>
                <td>연필</td>
                <td>300</td>
                <td rowspan="2">빨강</td>
            </tr>
            <tr>
                <td>지우개</td>
                <td>30000000</td>
            </tr>
        </table>
    </body>
</html>
